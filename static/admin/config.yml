backend:
  name: github
  repo: donny-c-1/roses-creations # Replace with your actual repo
  branch: main-branch # or master
  base_url: https://decap-cms-oauth.vercel.app # The "Gatekeeper" address
  auth_endpoint: auth

media_folder: "static/images/catalog" # Where uploaded photos will go
public_folder: "/images/catalog"      # How SvelteKit will reference them

collections:
  - name: "catalog"
    label: "Product Catalog"
    folder: "src/lib/data/catalog" # Where the data files will be saved
    extension: "json"
    format: "json"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "Product Name", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["men", "women", "unisex"] }
      - { label: "Product Image", name: "image", widget: "image" }
      # - { label: "Description", name: "body", widget: "markdown" }